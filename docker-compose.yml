services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightping-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    container_name: flightping-db
    environment:
      POSTGRES_DB: flightping
      POSTGRES_USER: flightping
      POSTGRES_PASSWORD: flightping
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightping -d flightping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
