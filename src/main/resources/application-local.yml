spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flightping}
    username: ${SPRING_DATASOURCE_USERNAME:flightping}
    password: ${SPRING_DATASOURCE_PASSWORD:flightping}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: local-dev-secret-key-must-be-at-least-32-characters-long
